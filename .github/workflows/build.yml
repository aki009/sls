name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        make
        ./sls --help || true
    - name: Install man page (test)
      run: |
        sudo mkdir -p /usr/local/share/man/man1
        sudo cp sls.1 /usr/local/share/man/man1/
        sudo mandb || true
        man sls | head -20 || true
